[project]
name = "solidrecipe"
version = "0.1.0"
description = "Experimental code-first CAD modeling interface"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["solidrecipe", "solidrecipe_runtime"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
