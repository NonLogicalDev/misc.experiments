[project]
name = "solidrecipe"
version = "0.1.0"
description = "Experimental code-first CAD modeling interface"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src/solidrecipe-core/python"}
py-modules = ["solidrecipe"]
